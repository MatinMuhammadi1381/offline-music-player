<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#060913" />
    <meta name="description" content="A private, offline-first player for music stored on your device." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Offline Music" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <script>
      try {
        const theme = localStorage.getItem("offline-music-theme");
        if (theme === "dark") document.querySelector('meta[name="apple-mobile-web-app-status-bar-style"]')?.setAttribute("content", "black");
        if (location.hostname === "appassets.androidplatform.net") {
          const lightMode = theme === "light";
          document.documentElement.dataset.theme = lightMode ? "light" : "dark";
          document.documentElement.style.colorScheme = lightMode ? "light" : "dark";
          window.OfflineMusicAndroid?.setTheme(lightMode);
        }
      } catch { /* Use the opaque light status bar if local storage is unavailable. */ }
    </script>
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" sizes="180x180" href="./icon-180.png" />
    <link rel="icon" type="image/svg+xml" href="./icon.svg" />
    <title>Offline Music</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
